<!doctype html>
<html lang="ja" class="ch-token-v2" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoloTracking</title>
    <style>
      :root, html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #070a13;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .init-loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #0f172a 0%, #070a13 70%);
      }
      .init-logo-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .init-logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, #6366f1, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      }
      .init-logo-icon svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .init-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f8fafc;
      }
      .init-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: init-spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        margin-bottom: 20px;
      }
      .init-status-text {
        font-size: 13px;
        font-weight: 500;
        color: #cbd5e1;
        margin-bottom: 6px;
      }
      .init-sub-text {
        font-size: 11px;
        color: #64748b;
      }
      @keyframes init-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="init-loading-container">
        <div class="init-logo-wrapper">
          <div class="init-logo-icon">
            <svg viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <span class="init-title">SoloTracking</span>
        </div>
        <div class="init-spinner"></div>
        <div class="init-status-text">起動しています...</div>
        <div class="init-sub-text">AIモデルとグラフィックス環境を準備中</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
